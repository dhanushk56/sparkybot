<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkyBot – Commands</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a14;
            color: #e8e0d8;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        a {
            color: #d4af37;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: #e8c84a;
        }

        /* ── Background layers ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.06), transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.04), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            position: fixed;
            top: -200px;
            left: -200px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08), transparent 70%);
            border-radius: 50%;
            filter: blur(200px);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 20s ease-in-out infinite alternate;
        }
        .glow-2 {
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06), transparent 70%);
            border-radius: 50%;
            filter: blur(180px);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 25s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.1);
            }
        }

        /* ── Loader ── */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            transition: opacity 0.8s ease;
        }
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader h1 {
            font-size: clamp(4rem, 16vw, 10rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.9);
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.97);
            }
        }

        /* ── Navbar ── */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #e8e0d8;
        }
        .logo span {
            background: #d4af37;
            color: #0d0d1a;
            padding: 0.1rem 0.7rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .nav-links a {
            color: #a09890;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.3s;
            cursor: pointer;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: #d4af37;
            transition: width 0.3s;
        }
        .nav-links a:hover {
            color: #e8e0d8;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: #d4af37;
        }
        .nav-links a.active::after {
            width: 100%;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #d4af37;
            color: #0d0d1a;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            background: #e8c84a;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(212, 175, 55, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #e8e0d8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        /* ── Main container ── */
        .main {
            position: relative;
            z-index: 1;
            padding: 2rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Commands header ── */
        .commands-header {
            text-align: center;
            padding: 2rem 0 1rem;
            animation: fadeUp 0.8s ease forwards;
        }
        .commands-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .commands-header p {
            color: #a09890;
            font-size: 1.1rem;
        }
        .commands-header code {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
        }

        /* ── Search bar ── */
        .search-box {
            display: flex;
            justify-content: center;
            margin: 2rem 0;
            animation: fadeUp 0.8s ease 0.1s both;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #e8e0d8;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-box input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        .search-box input::placeholder {
            color: #606070;
        }

        /* ── Commands table ── */
        .commands-table-wrap {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeUp 0.8s ease 0.2s both;
            transition: all 0.3s ease;
        }
        .commands-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .commands-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            background: rgba(212, 175, 55, 0.06);
            color: #d4af37;
            font-weight: 600;
            border-bottom: 2px solid rgba(212, 175, 55, 0.15);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .commands-table td {
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #c8c0b8;
            vertical-align: middle;
            transition: background 0.2s ease;
        }
        .commands-table tr:last-child td {
            border-bottom: none;
        }
        .commands-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }
        .commands-table .cmd-name {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #e8c84a;
            white-space: nowrap;
        }
        .commands-table .cmd-desc {
            color: #a09890;
            font-size: 0.9rem;
        }
        .commands-table .cmd-module {
            display: inline-block;
            background: rgba(212, 175, 55, 0.08);
            color: #d4af37;
            padding: 0.15rem 0.7rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── No results ── */
        .no-results {
            text-align: center;
            color: #808098;
            font-size: 1.1rem;
            padding: 3rem 0;
            display: none;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            color: #606070;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        .footer .links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .footer .links a {
            color: #808098;
            transition: color 0.3s;
        }
        .footer .links a:hover {
            color: #d4af37;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 1rem;
            }
            .nav-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            .commands-header h1 {
                font-size: 2.2rem;
            }
            .commands-table {
                font-size: 0.85rem;
            }
            .commands-table th,
            .commands-table td {
                padding: 0.7rem 1rem;
            }
            .commands-table .cmd-name {
                font-size: 0.75rem;
                white-space: normal;
            }
            .commands-table .cmd-desc {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .commands-header h1 {
                font-size: 1.8rem;
            }
            .btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }
            .commands-table th,
            .commands-table td {
                padding: 0.5rem 0.8rem;
            }
            .commands-table .cmd-module {
                display: none;
            }
        }
    </style>
</head>

                { name: 'verify', desc: 'Verify a member manually.', module: 'Verification' },
                { name: 'verifypanel', desc: 'Create a verification panel.', module: 'Verification' },
                { name: 'verifystatus', desc: 'Check verification status of a user.', module: 'Verification' },
                { name: 'warn', desc: 'Warn a member for breaking rules.', module: 'Moderation' },
                { name: 'warnings', desc: 'View warnings of a member.', module: 'Moderation' },
                { name: 'welset', desc: 'Set the welcome channel and message.', module: 'Welcome' },
                { name: 'with', desc: 'Withdraw money from your bank.', module: 'Economy' },
                { name: 'work', desc: 'Work your job to earn money.', module: 'Economy' },
                { name: 'youtube add', desc: 'Add a YouTube channel to track.', module: 'YouTube' },
                { name: 'youtube addfilter', desc: 'Add a keyword filter for YouTube notifications.', module: 'YouTube' },
                { name: 'youtube list', desc: 'List all tracked YouTube channels.', module: 'YouTube' },
                { name: 'youtube remove', desc: 'Remove a tracked YouTube channel.', module: 'YouTube' },
                { name: 'youtube removefilter', desc: 'Remove a keyword filter.', module: 'YouTube' }
            ];

            // Sort alphabetically by command name
            commands.sort((a, b) => a.name.localeCompare(b.name));

            const tableBody = document.getElementById('commandTableBody');
            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('noResults');

            function render(filter = '') {
                const lower = filter.toLowerCase().trim();
                const filtered = commands.filter(cmd =>
                    cmd.name.toLowerCase().includes(lower) ||
                    cmd.desc.toLowerCase().includes(lower) ||
                    cmd.module.toLowerCase().includes(lower)
                );

                if (filtered.length === 0) {
                    tableBody.innerHTML = '';
                    noResults.style.display = 'block';
                    return;
                }
                noResults.style.display = 'none';

                let html = '';
                filtered.forEach(cmd => {
                    html += `<tr>
                                <td class="cmd-name"><code>//${cmd.name}</code></td>
                                <td class="cmd-desc">${cmd.desc}</td>
                                <td style="text-align:right;"><span class="cmd-module">${cmd.module}</span></td>
                            </tr>`;
                });
                tableBody.innerHTML = html;
            }

            // Initial render
            render('');

            // Search listener
            searchInput.addEventListener('input', function() {
                render(this.value);
            });

            // ── Smooth scroll to top when page loads ──
            window.scrollTo({ top: 0, behavior: 'smooth' });

        })();
    </script>

</body>
</html>
